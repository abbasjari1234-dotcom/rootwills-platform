<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rootwills Original Logo Joined</title>
  <style>
    body {
      background: #070706;
      color: #FFF9E6;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 30px;
    }
    .card {
      background: #021F17;
      padding: 30px;
      border-radius: 24px;
      border: 1px solid rgba(228, 199, 103, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
  </style>
</head>
<body>

  <h1>Original Logo Cleanly Joined</h1>

  <div class="card">
    <svg width="240" height="240" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF9E6" />
          <stop offset="35%" stop-color="#E4C767" />
          <stop offset="70%" stop-color="#C9A227" />
          <stop offset="100%" stop-color="#F5E498" />
        </linearGradient>
        <linearGradient id="emeraldInner" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#10B981" />
          <stop offset="100%" stop-color="#047857" />
        </linearGradient>
      </defs>

      <!-- Outer Geometric Luxury Shield -->
      <polygon
        points="50,6 88,22 94,64 68,94 32,94 6,64 12,22"
        stroke="url(#goldLuxury)"
        stroke-width="3.5"
        fill="none"
        opacity="0.95"
      />

      <!-- Inner Emerald Accent Shield -->
      <polygon
        points="50,14 80,26 86,60 64,86 36,86 14,60 20,26"
        stroke="url(#emeraldInner)"
        stroke-width="1.5"
        fill="none"
        opacity="0.75"
      />

      <!-- Original 'R' Stem & Loop -->
      <path
        d="M 30 32 L 30 72 M 30 32 L 48 32 C 58 32 58 48 48 48 L 30 48"
        stroke="url(#goldLuxury)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Original 'R' Leg Seamlessly Joined to 'W' (Single Continuous Flow) -->
      <path
        d="M 44 48 L 54 72 L 66 52 L 78 72 L 86 48"
        stroke="url(#goldLuxury)"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Center Diamond Sparkle -->
      <polygon
        points="50,22 53,26 50,30 47,26"
        fill="url(#goldLuxury)"
      />
    </svg>
  </div>

</body>
</html>
