<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="35%" stop-color="#E4C767" />
      <stop offset="70%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#F5E498" />
    </linearGradient>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021F17" />
      <stop offset="100%" stop-color="#063E2E" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#emeraldBg)" />

  <!-- Outer Geometric Luxury Shield -->
  <polygon
    points="50,10 84,24 90,62 66,90 34,90 10,62 16,24"
    stroke="url(#goldLuxury)"
    stroke-width="3"
    fill="none"
    opacity="0.95"
  />

  <!-- Interlocking 'RW' Monogram (Pure Gold) -->
  <!-- 'R' -->
  <path
    d="M 32 32 L 32 68 M 32 32 L 48 32 C 57 32 57 46 48 46 L 32 46 M 44 46 L 56 68"
    stroke="url(#goldLuxury)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 'W' -->
  <path
    d="M 46 46 L 54 68 L 64 50 L 74 68 L 82 46"
    stroke="url(#goldLuxury)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />

  <!-- Sparkle Diamond -->
  <polygon points="50,22 53,25 50,28 47,25" fill="url(#goldLuxury)" />
</svg>
