<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="25%" stop-color="#F3DC82" />
      <stop offset="60%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#E4C767" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE899" />
      <stop offset="100%" stop-color="#A88214" />
    </linearGradient>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021F17" />
      <stop offset="100%" stop-color="#063E2E" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#emeraldBg)" />

  <!-- Outer Geometric Luxury Shield -->
  <polygon
    points="50,8 86,23 92,63 67,92 33,92 8,63 14,23"
    stroke="url(#goldLuxury)"
    stroke-width="2.8"
    fill="none"
    opacity="0.95"
  />

  <!-- Inner Emerald Accent Ring -->
  <polygon
    points="50,15 80,27 85,60 63,86 37,86 15,60 20,27"
    stroke="#10B981"
    stroke-width="1.2"
    stroke-dasharray="3 3"
    opacity="0.55"
  />

  <!-- Monogram: 'W' (Intertwined Base Layer) -->
  <path
    d="M 44 42 L 54 74 L 65 48 L 76 74 L 86 42"
    stroke="url(#goldAccent)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Monogram: 'R' (Foreground Heraldic Layer) -->
  <!-- R Main Spine & Serifs -->
  <path
    d="M 28 26 L 28 74"
    stroke="url(#goldLuxury)"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <path d="M 23 26 L 33 26" stroke="url(#goldLuxury)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 23 74 L 33 74" stroke="url(#goldLuxury)" stroke-width="2.5" stroke-linecap="round" />

  <!-- R Upper Loop -->
  <path
    d="M 28 26 L 46 26 C 56 26 56 46 46 46 L 28 46"
    stroke="url(#goldLuxury)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Optical Clearance Mask for Intertwine -->
  <path
    d="M 42 46 Q 48 58 60 74"
    stroke="#021F17"
    stroke-width="8.5"
    stroke-linecap="round"
  />

  <!-- R Graceful Sweep Leg -->
  <path
    d="M 42 46 Q 48 58 60 74"
    stroke="url(#goldLuxury)"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path d="M 55 74 L 64 74" stroke="url(#goldLuxury)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Royal Diamond Finial -->
  <polygon points="50,18 53,23 50,27 47,23" fill="url(#goldLuxury)" />
</svg>
