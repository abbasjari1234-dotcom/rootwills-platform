<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="25%" stop-color="#F3DC82" />
      <stop offset="60%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#E4C767" />
    </linearGradient>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021F17" />
      <stop offset="100%" stop-color="#063E2E" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#emeraldBg)" />

  <!-- Outer Geometric Luxury Shield -->
  <polygon
    points="50,8 86,23 92,63 67,92 33,92 8,63 14,23"
    stroke="url(#goldLuxury)"
    stroke-width="2.8"
    fill="none"
    opacity="0.95"
  />

  <!-- Inner Emerald Accent Ring -->
  <polygon
    points="50,15 80,27 85,60 63,86 37,86 15,60 20,27"
    stroke="#10B981"
    stroke-width="1.2"
    stroke-dasharray="3 3"
    opacity="0.55"
  />

  <!-- SEAMLESS JOINED 'RW' LIGATURE (Single Unbroken Mark, Zero Overlap) -->
  <!-- R Main Spine -->
  <path
    d="M 26 28 L 26 72"
    stroke="url(#goldLuxury)"
    stroke-width="6"
    stroke-linecap="round"
  />
  <path d="M 21 28 L 31 28" stroke="url(#goldLuxury)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 21 72 L 31 72" stroke="url(#goldLuxury)" stroke-width="2.5" stroke-linecap="round" />

  <!-- R Upper Loop -->
  <path
    d="M 26 28 L 45 28 C 55 28 55 48 45 48 L 26 48"
    stroke="url(#goldLuxury)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- THE SEAMLESS JOIN: Leg of R connects directly into W! -->
  <path
    d="M 41 48 L 51 72 L 63 46 L 75 72 L 85 44"
    stroke="url(#goldLuxury)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Royal Diamond Finial -->
  <polygon points="50,18 53,23 50,27 47,23" fill="url(#goldLuxury)" />
</svg>
