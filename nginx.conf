# Rootwills Platform — Production NGINX Reverse Proxy Configuration
# Optimised for Maximum Gzip & Brotli Compression & 100/100 Performance Score

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # GZIP COMPRESSION CONFIGURATION
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        font/opentype
        font/ttf
        font/eot
        image/svg+xml
        image/x-icon;

    # =========================================================================
    # BROTLI COMPRESSION (When ngx_brotli module is compiled)
    # =========================================================================
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 256;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Upstream Next.js Node Service
    upstream nextjs_upstream {
        server nextjs:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Client Body Limits
        client_max_body_size 25M;

        # Standard Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Vary "Accept-Encoding" always;

        # Next.js Static Chunks (Immutable 1-Year Cache with Compression)
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
            gzip_static on;
        }

        # Static Assets & Public Images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
            add_header Vary "Accept-Encoding";
        }

        # Dynamic App Routes & API Endpoints
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
