version: '3.8'

services:
  # Next.js Application Standalone Service
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rootwills_app
    restart: always
    expose:
      - "3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Production NGINX Reverse Proxy with Gzip Compression
  nginx:
    image: nginx:alpine
    container_name: rootwills_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
